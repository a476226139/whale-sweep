<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>海面·扫雷</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#0a3b5c 0%,#05203a 45%,#02101c 100%);
  color:#cfeeff;font:16px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100%;overflow:hidden}
.wrap{padding:16px 0 22px;text-align:center;position:relative}
h1{font-size:18px;font-weight:600;letter-spacing:.28em;margin:0 0 3px;color:#9fe6ff}
.sub{font-size:11px;letter-spacing:.12em;color:#5c93b5;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:6px;margin:0 0 7px;padding:0 2px}
.chips{display:flex;gap:5px}
.chip{background:rgba(127,227,255,.08);border:1px solid rgba(140,220,255,.2);color:#bfeaff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.chip.on{background:rgba(127,227,255,.28);color:#02131f;border-color:transparent}
.tools{display:flex;gap:5px}
.mode{background:rgba(127,227,255,.1);border:1px solid rgba(140,220,255,.22);color:#bfeaff;border-radius:999px;padding:4px 10px;font-size:12px;cursor:pointer}
.mode.on{background:rgba(127,227,255,.28);color:#02131f}
.mode.off{opacity:.4}
.stats{display:flex;justify-content:space-between;font-size:12px;color:#7fc4e6;margin-bottom:9px;padding:0 3px}
.stats b{color:#e8faff}
#board{display:grid;gap:2px;background:rgba(2,18,32,.55);padding:7px;border-radius:14px;border:1px solid rgba(140,220,255,.22);box-shadow:0 0 60px -25px #37b6ff;position:relative;margin:0 auto}
.cell{aspect-ratio:1;padding:0;font-family:inherit;touch-action:manipulation;border-radius:4px;border:1px solid rgba(120,210,255,.14);background:linear-gradient(160deg,#0e5478,#0a4664);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:var(--fs,17px);color:#d9f4ff;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .08s,background .15s;position:relative;overflow:hidden}
.cell:active{transform:scale(.94)}
.cell.open{background:rgba(8,48,74,.55);border-color:rgba(120,210,255,.1);cursor:default}
.cell.flag{background:linear-gradient(160deg,#123a52,#0d2c40);font-size:calc(var(--fs,17px) * .9)}
.cell.q{color:#7fc4e6}
.cell.net{background:linear-gradient(160deg,#5a1030,#2b0a1a)}
.cell.net::after{content:"🕸";font-size:calc(var(--fs,17px) * .9);opacity:.9}
.cell.boom{background:radial-gradient(circle,#ff8fab,#7a1230);animation:boom .4s ease-out}
.cell.ripple::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #9ee7ff;opacity:.8;animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes boom{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.fish{position:absolute;font-size:12px;pointer-events:none;opacity:0;z-index:3;animation:swim 1.4s ease-out forwards}
@keyframes swim{0%{transform:translate(0,0) scale(.6);opacity:0}25%{opacity:.95}100%{transform:translate(var(--dx),var(--dy)) scale(1.15);opacity:0}}
.n1{color:#8ee6ff}.n2{color:#7fe0a8}.n3{color:#ffd166}.n4{color:#ffb3c6}.n5{color:#c9a7ff}.n6{color:#7fd4ff}.n7{color:#e6e6e6}.n8{color:#ff9f9f}
.hint{font-size:11px;color:#5e93b3;margin-top:10px;letter-spacing:.03em}
#msg{margin-top:7px;height:20px;font-size:13px;color:#9fe6ff}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,12,22,.86);border-radius:14px;flex-direction:column;gap:8px;z-index:8;padding:16px}
.overlay.show{display:flex}
.overlay p{margin:0;font-size:15px;color:#d8f4ff}
.overlay small{color:#7fc4e6;font-size:12px;line-height:1.6;max-width:260px}
.overlay button{background:#7fe3ff;color:#02131f;border:0;border-radius:999px;padding:7px 20px;font-size:13px;font-weight:600;cursor:pointer}
.gate{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(2,12,22,.9);border-radius:14px;cursor:pointer}
.gate.hide{display:none}
.gate p{margin:0;font-size:16px;color:#bfeaff;letter-spacing:.1em}
.gate small{color:#5e93b3;font-size:12px}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>海 面 · 扫 雷</h1>
  <div class="sub" id="sub">NINE BY NINE · TEN NETS</div>
  <div class="row">
    <div class="chips" id="chips">
      <button class="chip on" data-lv="easy">初</button>
      <button class="chip" data-lv="mid">中</button>
      <button class="chip" data-lv="hard">高</button>
    </div>
    <div class="tools">
      <button class="mode" id="modeBtn">挖</button>
      <button class="mode" id="undoBtn" title="撤销">↶</button>
      <button class="mode" id="musicBtn" title="背景音乐">♪</button>
    </div>
  </div>
  <div class="stats">
    <span>渔网 <b id="mines">10</b></span>
    <span>⏱ <b id="time">0:00</b></span>
    <span>泡泡 <b id="flags">0</b></span>
    <span>最佳 <b id="best">--</b></span>
  </div>
  <div id="board"></div>
  <div class="hint">右键/长按循环：泡泡 → 问号 → 空 · 点已翻开的格子可再掀一圈</div>
  <div id="msg"></div>
  <div class="overlay" id="over"><p id="overText"></p><small id="overSub"></small><button id="again">再来一局</button></div>
  <div class="gate" id="gate"><p>轻点一下，下水</p><small>声音和背景音乐会从这一刻开始</small></div>
</div>
<script>
const LEVELS={easy:{w:9,h:9,m:10,name:'NINE BY NINE · TEN NETS'},mid:{w:16,h:16,m:40,name:'SIXTEEN · FORTY NETS'},hard:{w:30,h:16,m:99,name:'THIRTY BY SIXTEEN · 99 NETS'}};
let W=9,H=9,M=10,level='easy';
let cells=[],started=false,over=false,flags=0,opened=0,mode='dig';
let elapsed=0,timerId=null,undoStack=[];
const wrapEl=document.getElementById('wrap');
const boardEl=document.getElementById('board');
const minesEl=document.getElementById('mines');
const flagsEl=document.getElementById('flags');
const timeEl=document.getElementById('time');
const bestEl=document.getElementById('best');
const msgEl=document.getElementById('msg');
const subEl=document.getElementById('sub');
const overlay=document.getElementById('over');
const overText=document.getElementById('overText');
const overSub=document.getElementById('overSub');
const musicBtn=document.getElementById('musicBtn');
const gate=document.getElementById('gate');

/* ---------- 声音 ---------- */
let actx=null,master=null,bgmBus=null,bgmTimer=null,bgmStep=0,bgmNext=0,musicOn=true;
function makeImpulse(sec,decay){
  const rate=actx.sampleRate,len=Math.floor(rate*sec);
  const buf=actx.createBuffer(2,len,rate);
  for(let ch=0;ch<2;ch++){
    const d=buf.getChannelData(ch);
    for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,decay);
  }
  return buf;
}
function ensureAudio(){
  if(actx)return true;
  const AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return false;
  actx=new AC();
  master=actx.createGain();master.gain.value=0.55;master.connect(actx.destination);
  const verb=actx.createConvolver();verb.buffer=makeImpulse(2.6,2.2);
  const wet=actx.createGain();wet.gain.value=0.45;verb.connect(wet);wet.connect(master);
  bgmBus=actx.createGain();bgmBus.gain.value=musicOn?0.5:0;
  bgmBus.connect(master);bgmBus.connect(verb);
  startBGM();
  return true;
}
function tone(f1,f2,dur,type,vol,at){
  if(!actx)return;
  const t0=at||actx.currentTime;
  const o=actx.createOscillator(),g=actx.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f1,t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(30,f2),t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol,t0+Math.min(0.02,dur*0.3));
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(master);
  o.start(t0);o.stop(t0+dur+0.05);
}
const PENT=[0,2,4,7,9];
function sfxDig(x,y){
  const f=261.63*Math.pow(2,PENT[x%5]/12)*(y<H/2?2:1);
  tone(f*1.5,f,0.15,'sine',0.1);
  tone(f*3,f*2,0.07,'triangle',0.03);
}
function sfxFlag(){tone(760,1180,0.1,'sine',0.08);}
function sfxMark(){tone(560,620,0.08,'sine',0.06);}
function sfxUndo(){tone(300,620,0.12,'sine',0.07);}
function sfxLose(){tone(180,50,0.9,'sawtooth',0.15);tone(120,40,1.2,'sine',0.11);}
function sfxWin(){[880,1174.66,1318.51].forEach((f,i)=>tone(f,f,0.55,'sine',0.08,actx.currentTime+i*0.18));}
const CHORDS=[[220,261.63,329.63],[174.61,220,261.63],[130.81,164.81,196],[196,246.94,293.66]];
const SCALE=[440,523.25,587.33,659.25,783.99,880];
function pad(freq,t,dur){
  const o=actx.createOscillator(),g=actx.createGain(),f=actx.createBiquadFilter();
  o.type='sine';o.frequency.value=freq;
  f.type='lowpass';f.frequency.value=800;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(0.045,t+1.8);
  g.gain.linearRampToValueAtTime(0.0001,t+dur);
  o.connect(f);f.connect(g);g.connect(bgmBus);
  o.start(t);o.stop(t+dur+0.1);
}
function pluck(freq,t){
  const o=actx.createOscillator(),g=actx.createGain();
  o.type='triangle';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(0.045,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+1.0);
  o.connect(g);g.connect(bgmBus);
  o.start(t);o.stop(t+1.05);
}
function playStep(i,t){
  const ci=Math.floor(i/4)%4;
  if(i%4===0)CHORDS[ci].forEach(f=>pad(f,t,8.6));
  if(i%2===0)pluck(SCALE[(i*2+ci)%SCALE.length],t+0.04);
}
function startBGM(){
  if(!actx||bgmTimer)return;
  bgmNext=actx.currentTime+0.4;bgmStep=0;
  bgmTimer=setInterval(()=>{
    if(!actx)return;
    while(bgmNext<actx.currentTime+0.7){playStep(bgmStep,bgmNext);bgmNext+=1.0;bgmStep++;}
  },200);
}

/* ---------- 棋盘 ---------- */
function bestKey(){return 'whale-sweep-best-'+level;}
function getBest(){try{return parseInt(localStorage.getItem(bestKey())||'0',10)||0;}catch(e){return 0;}}
function setBest(v){try{localStorage.setItem(bestKey(),String(v));}catch(e){}}
function fmt(s){const m=Math.floor(s/60),x=s%60;return m+':'+String(x).padStart(2,'0');}
function updateBest(){
  const b=getBest();
  bestEl.textContent=b?fmt(b):'--';
}

function reset(keepLevel){
  const L=LEVELS[level];W=L.w;H=L.h;M=L.m;
  subEl.textContent=L.name;
  cells=[];started=false;over=false;flags=0;opened=0;mode='dig';elapsed=0;undoStack=[];
  clearInterval(timerId);timerId=null;timeEl.textContent='0:00';
  document.getElementById('modeBtn').textContent='挖';
  document.getElementById('modeBtn').classList.remove('on');
  overlay.classList.remove('show');msgEl.textContent='';
  minesEl.textContent=M;flagsEl.textContent=0;
  wrapEl.style.width=Math.min(window.innerWidth*0.96, W*46+30)+'px';
  boardEl.style.gridTemplateColumns='repeat('+W+',1fr)';
  boardEl.style.setProperty('--fs', W<=9?'17px':(W<=16?'14px':'11px'));
  boardEl.innerHTML='';
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){
    const el=document.createElement('button');
    el.className='cell';
    const d={x,y,mine:false,near:0,state:0,el,longPressed:false};
    el.addEventListener('click',()=>{
      if(d.longPressed){d.longPressed=false;return;}
      onTap(x,y,false);
    });
    el.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(d.longPressed)return;
      onTap(x,y,true);
    });
    let timer=null;
    el.addEventListener('touchstart',()=>{
      d.longPressed=false;
      timer=setTimeout(()=>{timer=null;d.longPressed=true;onTap(x,y,true);},420);
    },{passive:true});
    el.addEventListener('touchend',()=>{if(timer){clearTimeout(timer);timer=null;}});
    el.addEventListener('touchmove',()=>{if(timer){clearTimeout(timer);timer=null;}});
    boardEl.appendChild(el);
    cells.push(d);
  }
  updateBest();
}
function at(x,y){return (x<0||y<0||x>=W||y>=H)?null:cells[y*W+x];}

function placeMines(sx,sy){
  const safe=new Set();
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const X=sx+dx,Y=sy+dy;
    if(X>=0&&Y>=0&&X<W&&Y<H)safe.add(Y*W+X);
  }
  const pool=[];
  for(let i=0;i<W*H;i++)if(!safe.has(i))pool.push(i);
  for(let i=pool.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;const t=pool[i];pool[i]=pool[j];pool[j]=t;}
  for(const c of cells){c.mine=false;c.near=0;}
  for(let k=0;k<M&&k<pool.length;k++)cells[pool[k]].mine=true;
  for(const c of cells){
    let n=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const X=c.x+dx,Y=c.y+dy;
      if(X<0||Y<0||X>=W||Y>=H)continue;
      if(cells[Y*W+X].mine)n++;
    }
    c.near=n;
  }
}

/* 求解器：只用必然推理，能推完才算「无猜」 */
function isSolvable(sx,sy){
  const k=new Uint8Array(W*H);
  const stack=[sy*W+sx];
  k[stack[0]]=1;
  while(stack.length){
    const i=stack.pop();
    if(cells[i].near!==0)continue;
    const c=cells[i];
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy)continue;
      const X=c.x+dx,Y=c.y+dy;
      if(X<0||Y<0||X>=W||Y>=H)continue;
      const n=Y*W+X;
      if(k[n]===0){k[n]=1;stack.push(n);}
    }
  }
  let changed=true,guard=0;
  while(changed&&guard++<200){
    changed=false;
    for(let i=0;i<k.length;i++){
      if(k[i]!==1)continue;
      const c=cells[i];
      if(c.near<=0)continue;
      let unk=0,mn=0;const nb=[];
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const X=c.x+dx,Y=c.y+dy;
        if(X<0||Y<0||X>=W||Y>=H)continue;
        const n=Y*W+X;
        if(k[n]===0){unk++;nb.push(n);}
        else if(k[n]===2)mn++;
      }
      if(!unk)continue;
      if(mn===c.near){for(const n of nb)k[n]=1;changed=true;}
      else if(mn+unk===c.near){for(const n of nb)k[n]=2;changed=true;}
    }
    for(let i=0;i<k.length;i++){
      if(k[i]!==1||cells[i].near!==0)continue;
      const c=cells[i];
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dy)continue;
        const X=c.x+dx,Y=c.y+dy;
        if(X<0||Y<0||X>=W||Y>=H)continue;
        const n=Y*W+X;
        if(k[n]===0)k[n]=1;
      }
    }
  }
  for(let i=0;i<k.length;i++)if(!cells[i].mine&&k[i]!==1)return false;
  return true;
}

function generate(sx,sy){
  const tries=level==='hard'?40:(level==='mid'?90:140);
  for(let t=0;t<tries;t++){
    placeMines(sx,sy);
    if(isSolvable(sx,sy))return true;
  }
  return false;
}

/* ---------- 渲染 ---------- */
function paint(c){
  const el=c.el;
  el.className='cell';
  el.textContent='';
  if(c.state===1){
    el.classList.add('open');
    if(c.mine)return;
    if(c.near>0){el.textContent=c.near;el.classList.add('n'+c.near);}
  }else if(c.state===2){
    el.classList.add('flag');el.textContent='🫧';
  }else if(c.state===3){
    el.textContent='?';el.classList.add('q');
  }
}

/* ---------- 撤销 ---------- */
function snapshot(){
  undoStack.push({s:cells.map(c=>c.state),opened,flags,elapsed,over});
  if(undoStack.length>80)undoStack.shift();
}
function undo(){
  if(!undoStack.length||!started)return;
  const snap=undoStack.pop();
  over=false;opened=snap.opened;flags=snap.flags;
  snapshotElapsed=snap.elapsed;elapsed=snap.elapsed;timeEl.textContent=fmt(elapsed);
  for(let i=0;i<cells.length;i++){cells[i].state=snap.s[i];paint(cells[i]);}
  overlay.classList.remove('show');msgEl.textContent='';
  flagsEl.textContent=flags;
  if(!over&&snap.opened===0){}
  sfxUndo();
  if(actx&&actx.state==='suspended')actx.resume();
}

/* ---------- 游鱼 ---------- */
function spawnFish(c){
  const n=2+Math.floor(Math.random()*3);
  for(let i=0;i<n;i++){
    const f=document.createElement('span');
    f.className='fish';
    f.textContent=Math.random()<0.5?'🐟':'🐠';
    f.style.left=(c.el.offsetLeft+6)+'px';
    f.style.top=(c.el.offsetTop+6)+'px';
    f.style.setProperty('--dx',((Math.random()*2-1)*90)+'px');
    f.style.setProperty('--dy',((Math.random()*2-1)*70)+'px');
    f.style.animationDelay=(i*0.07)+'s';
    boardEl.appendChild(f);
    setTimeout(()=>f.remove(),1900);
  }
}

/* ---------- 计时 ---------- */
function startTimer(){
  if(timerId)return;
  timerId=setInterval(()=>{
    if(over)return;
    elapsed++;timeEl.textContent=fmt(elapsed);
  },1000);
}

/* ---------- 玩法 ---------- */
function reveal(c,fromFlood){
  if(!c||c.state!==0||over)return;
  if(c.mine){c.state=1;c.el.classList.add('open','boom');lose(c);return;}
  if(!fromFlood)sfxDig(c.x,c.y);
  c.state=1;opened++;
  c.el.classList.add('open');
  c.el.textContent='';
  if(c.near>0){c.el.textContent=c.near;c.el.classList.add('n'+c.near);if(!fromFlood)spawnFish(c);}
  else{
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(dx||dy)reveal(at(c.x+dx,c.y+dy),true);
    }
  }
  checkWin();
}
function openAround(c){
  if(over)return;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const n=at(c.x+dx,c.y+dy);
    if(n&&n.state===0)reveal(n,true);
    if(over)return;
  }
  checkWin();
}
function toggleMark(c){
  snapshot();
  if(c.state===0){c.state=2;flags++;sfxFlag();}
  else if(c.state===2){c.state=3;flags--;sfxMark();}
  else if(c.state===3){c.state=0;sfxMark();}
  paint(c);flagsEl.textContent=flags;
}
function onTap(x,y,flag){
  const c=at(x,y);
  if(!c||over)return;
  ensureAudio();
  if(actx&&actx.state==='suspended')actx.resume();
  if(mode==='flag'&&!flag)flag=true;
  if(!started&&!flag){
    started=true;
    generate(x,y);
    startTimer();
  }
  if(flag){
    if(c.state===1)return;
    if(!started){snapshot();return;}
    toggleMark(c);
    return;
  }
  if(c.state===2||c.state===3)return;
  if(c.state===1){snapshot();openAround(c);return;}
  snapshot();reveal(c,false);
}
function checkWin(){
  if(opened===W*H-M&&!over){
    over=true;clearInterval(timerId);timerId=null;sfxWin();
    const isNew=!getBest()||elapsed<getBest();
    if(isNew&&elapsed>0)setBest(elapsed);
    updateBest();
    overText.textContent='海面静了下来。';
    overSub.textContent='用时 '+fmt(elapsed)+(isNew?' · 新纪录':' · 最佳 '+fmt(getBest()))+' · 一条鱼都没被捞走';
    overlay.classList.add('show');
  }
}
function estimateRisk(c){
  let p=0;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const n=at(c.x+dx,c.y+dy);
    if(!n||n.state!==1||n.near<=0)continue;
    let unk=0,fl=0;
    for(let ey=-1;ey<=1;ey++)for(let ex=-1;ex<=1;ex++){
      if(!ex&&!ey)continue;
      const m=at(n.x+ex,n.y+ey);
      if(!m)continue;
      if(m.state===0||m.state===3)unk++;
      else if(m.state===2)fl++;
    }
    if(unk>0){const q=(n.near-fl)/unk;p=Math.max(p,q);}
  }
  if(p<=0)p=10/ (W*H-M);
  return Math.min(0.99,Math.max(0.01,p));
}
function lose(c){
  over=true;clearInterval(timerId);timerId=null;sfxLose();
  c.el.classList.add('boom');
  cells.forEach(d=>{if(d.mine&&d.state===0){d.state=1;d.el.classList.add('open','net');}});
  const p=Math.round(estimateRisk(c)*100);
  overText.textContent='（扑腾）被捞走了。';
  overSub.textContent='这一步，粗估有 '+p+'% 是渔网 · 用时 '+fmt(elapsed);
  overlay.classList.add('show');
}

/* ---------- 交互绑定 ---------- */
document.getElementById('modeBtn').addEventListener('click',e=>{
  mode=mode==='dig'?'flag':'dig';
  e.currentTarget.textContent=mode==='dig'?'挖':'标';
  e.currentTarget.classList.toggle('on',mode==='flag');
});
document.getElementById('undoBtn').addEventListener('click',()=>{ensureAudio();undo();});
musicBtn.addEventListener('click',e=>{
  e.stopPropagation();ensureAudio();
  musicOn=!musicOn;
  musicBtn.classList.toggle('off',!musicOn);
  if(bgmBus)bgmBus.gain.setTargetAtTime(musicOn?0.5:0,actx.currentTime,0.12);
});
document.querySelectorAll('.chip').forEach(b=>{
  b.addEventListener('click',()=>{
    level=b.dataset.lv;
    document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
    reset();
  });
});
function enterWater(){
  ensureAudio();
  if(actx&&actx.state==='suspended')actx.resume();
  gate.classList.add('hide');
}
gate.addEventListener('pointerdown',enterWater);
gate.addEventListener('click',enterWater);
document.getElementById('again').addEventListener('click',()=>{overlay.classList.remove('show');reset();});
window.addEventListener('resize',()=>{wrapEl.style.width=Math.min(window.innerWidth*0.96, W*46+30)+'px';});
reset();
</script>
