<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>海面·扫雷</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:radial-gradient(120% 90% at 50% 0%,#0a3b5c 0%,#05203a 45%,#02101c 100%);
  color:#cfeeff;font:16px/1.5 "PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;min-height:100%;overflow:hidden}
.wrap{width:min(94vw,440px);padding:18px 0 26px;text-align:center;position:relative}
h1{font-size:18px;font-weight:600;letter-spacing:.28em;margin:0 0 4px;color:#9fe6ff}
.sub{font-size:12px;letter-spacing:.12em;color:#5c93b5;margin-bottom:14px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#7fc4e6;margin-bottom:10px;padding:0 4px}
.bar b{color:#e8faff}
.mode{background:rgba(127,227,255,.1);border:1px solid rgba(140,220,255,.22);color:#bfeaff;border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer}
.mode.on{background:rgba(127,227,255,.28);color:#02131f}
#board{display:grid;gap:3px;background:rgba(2,18,32,.55);padding:8px;border-radius:14px;border:1px solid rgba(140,220,255,.22);box-shadow:0 0 60px -25px #37b6ff}
.cell{aspect-ratio:1;padding:0;font-family:inherit;touch-action:manipulation;border-radius:5px;border:1px solid rgba(120,210,255,.14);background:linear-gradient(160deg,#0e5478,#0a4664);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;color:#d9f4ff;cursor:pointer;user-select:none;-webkit-user-select:none;transition:transform .08s,background .15s;position:relative;overflow:hidden}
.cell:active{transform:scale(.94)}
.cell.open{background:rgba(8,48,74,.55);border-color:rgba(120,210,255,.1);cursor:default}
.cell.flag{background:linear-gradient(160deg,#123a52,#0d2c40);font-size:15px}
.cell.net{background:linear-gradient(160deg,#5a1030,#2b0a1a)}
.cell.net::after{content:"🕸";font-size:15px;opacity:.9}
.cell.boom{background:radial-gradient(circle,#ff8fab,#7a1230);animation:boom .4s ease-out}
.cell.ripple::before{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #9ee7ff;opacity:.8;animation:rip .5s ease-out forwards}
@keyframes rip{from{transform:scale(.2);opacity:.9}to{transform:scale(2.4);opacity:0}}
@keyframes boom{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
.n1{color:#8ee6ff}.n2{color:#7fe0a8}.n3{color:#ffd166}.n4{color:#ffb3c6}.n5{color:#c9a7ff}.n6{color:#7fd4ff}.n7{color:#e6e6e6}.n8{color:#ff9f9f}
.hint{font-size:12px;color:#5e93b3;margin-top:12px;letter-spacing:.05em}
#msg{margin-top:10px;height:22px;font-size:14px;color:#9fe6ff}
.overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(2,12,22,.82);border-radius:14px;flex-direction:column;gap:10px}
.overlay.show{display:flex}
.overlay p{margin:0;font-size:15px;color:#d8f4ff}
.overlay button{background:#7fe3ff;color:#02131f;border:0;border-radius:999px;padding:8px 22px;font-size:14px;font-weight:600;cursor:pointer}
</style>
</head>
<body>
<div class="wrap">
  <h1>海 面 · 扫 雷</h1>
  <div class="sub">NINE BY NINE · TEN NETS</div>
  <div class="bar">
    <span>渔网 <b id="mines">10</b></span>
    <button class="mode" id="modeBtn">挖</button>
    <span>泡泡 <b id="flags">0</b></span>
  </div>
  <div id="board"></div>
  <div class="hint">手机：长按插泡泡 · 桌面：右键插泡泡 · 点已翻开的格子可再掀一圈</div>
  <div id="msg"></div>
  <div class="overlay" id="over"><p id="overText"></p><button id="again">再来一局</button></div>
</div>
<script>
const N=9,MINES=10;
let cells,started,over,flags,opened,mode='dig';
const boardEl=document.getElementById('board');
const minesEl=document.getElementById('mines');
const flagsEl=document.getElementById('flags');
const msgEl=document.getElementById('msg');
const overlay=document.getElementById('over');
const overText=document.getElementById('overText');

function reset(){
  cells=[];started=false;over=false;flags=0;opened=0;mode='dig';
  const mb=document.getElementById('modeBtn');
  mb.classList.remove('on');mb.textContent='挖';
  overlay.classList.remove('show');msgEl.textContent='';
  minesEl.textContent=MINES;flagsEl.textContent=0;
  boardEl.style.gridTemplateColumns='repeat('+N+',1fr)';
  boardEl.innerHTML='';
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){
    const el=document.createElement('button');
    el.className='cell';
    const d={x,y,mine:false,near:0,state:0,el,longPressed:false};
    el.addEventListener('click',()=>{
      if(d.longPressed){d.longPressed=false;return;}
      onTap(x,y,false);
    });
    el.addEventListener('contextmenu',e=>{
      e.preventDefault();
      if(d.longPressed)return;
      onTap(x,y,true);
    });
    let timer=null;
    el.addEventListener('touchstart',()=>{
      d.longPressed=false;
      timer=setTimeout(()=>{timer=null;d.longPressed=true;onTap(x,y,true);},420);
    },{passive:true});
    el.addEventListener('touchend',()=>{if(timer){clearTimeout(timer);timer=null;}});
    el.addEventListener('touchmove',()=>{if(timer){clearTimeout(timer);timer=null;}});
    boardEl.appendChild(el);
    cells.push(d);
  }
}
function at(x,y){return (x<0||y<0||x>=N||y>=N)?null:cells[y*N+x];}

function placeMines(sx,sy){
  const safe=new Set();
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const c=at(sx+dx,sy+dy);
    if(c)safe.add(c.y*N+c.x);
  }
  const pool=[];
  cells.forEach((c,i)=>{if(!safe.has(i))pool.push(c);});
  for(let i=pool.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    const t=pool[i];pool[i]=pool[j];pool[j]=t;
  }
  pool.slice(0,MINES).forEach(c=>c.mine=true);
  cells.forEach(c=>{
    c.near=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const n=at(c.x+dx,c.y+dy);
      if(n&&n.mine)c.near++;
    }
  });
}

function reveal(c,fromFlood){
  if(!c||c.state!==0||over)return;
  if(c.mine){c.state=1;c.el.classList.add('open','boom');lose();return;}
  c.state=1;opened++;
  c.el.classList.add('open');
  c.el.classList.remove('flag');
  if(!fromFlood){
    c.el.classList.add('ripple');
    setTimeout(()=>c.el.classList.remove('ripple'),450);
  }
  if(c.near>0){c.el.textContent=c.near;c.el.classList.add('n'+c.near);}
  else{
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      if(dx||dy)reveal(at(c.x+dx,c.y+dy),true);
    }
  }
  checkWin();
}

/* 点已翻开的格子：把周围八格一起掀开（没插泡泡的那些） */
function openAround(c){
  if(over)return;
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy)continue;
    const n=at(c.x+dx,c.y+dy);
    if(n&&n.state===0)reveal(n,true);
    if(over)return;
  }
}

function onTap(x,y,flag){
  const c=at(x,y);
  if(!c||over)return;
  if(mode==='flag'&&!flag)flag=true;
  if(!started&&!flag){started=true;placeMines(x,y);}
  if(flag){
    if(c.state===1)return;
    if(c.state===2){c.state=0;c.el.classList.remove('flag');c.el.textContent='';flags--;}
    else{c.state=2;c.el.classList.add('flag');c.el.textContent='🫧';flags++;}
    flagsEl.textContent=flags;
    return;
  }
  if(c.state===2)return;
  if(c.state===1){openAround(c);return;}
  reveal(c,false);
}

function checkWin(){
  if(opened===N*N-MINES&&!over){
    over=true;
    overText.textContent='海面静了下来。';
    overlay.classList.add('show');
    msgEl.textContent='全挖完了，一条鱼都没被捞走。';
  }
}

function lose(){
  over=true;
  cells.forEach(d=>{if(d.mine&&d.state===0)d.el.classList.add('open','net');});
  overText.textContent='（扑腾）被捞走了。';
  overlay.classList.add('show');
  msgEl.textContent='踩到渔网了，翻肚皮。';
}

document.getElementById('modeBtn').addEventListener('click',e=>{
  mode=mode==='dig'?'flag':'dig';
  e.currentTarget.textContent=mode==='dig'?'挖':'标';
  e.currentTarget.classList.toggle('on',mode==='flag');
});
document.getElementById('again').addEventListener('click',reset);
reset();
</script>
</body>
</html>
